version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: app.Dockerfile
    container_name: porqua-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    networks:
      - porqua-net

  ui:
    build:
      context: .
      dockerfile: ui.Dockerfile
    container_name: porqua-ui
    ports:
      - "8888:8888"
    volumes:
      - ./ui:/workspace/ui
    environment:
      - API_BASE_URL=http://api:8000
      - PYTHONUNBUFFERED=1
    networks:
      - porqua-net

networks:
  porqua-net:
    driver: bridge 